<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simulador de incentivos para flotas de reparto con análisis climático en tiempo real por zonas urbanas.">
    <title>Budget Optimizer | Delivery Fleet Incentive System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ── Mobile hamburger toggle ─────────────────────── -->
    <button id="sidebar-toggle"
            class="sidebar-toggle-btn"
            aria-label="Abrir controles"
            aria-expanded="false"
            aria-controls="main-sidebar">
        <!-- Hamburger icon -->
        <svg class="icon-menu" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <!-- Close (X) icon -->
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
            <line x1="18" y1="6"  x2="6"  y2="18"/>
            <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
    </button>

    <!-- ── Scrim overlay (mobile only) ─────────────────── -->
    <div id="scrim" class="scrim" aria-hidden="true"></div>

    <!-- ── App shell ───────────────────────────────────── -->
    <div class="app-container">

        <!-- Sidebar / Control panel -->
        <aside class="sidebar" id="main-sidebar"
               role="complementary"
               aria-label="Panel de control">

            <!-- Drag handle (visible on mobile) -->
            <div class="drag-handle" aria-hidden="true"></div>

            <header>
                <h1>Budget <span>Optimizer</span></h1>
                <p>Delivery Fleet Incentive System</p>
            </header>

            <section class="controls">
                <div class="mode-tabs" role="tablist" aria-label="Modo de clima">
                    <button class="mode-tab active" data-mode="real"
                            role="tab" aria-selected="true">Clima Real</button>
                    <button class="mode-tab" data-mode="simulation"
                            role="tab" aria-selected="false">Clima Simulado</button>
                </div>

                <!-- City search -->
                <div class="input-group search-box" style="position: relative;">
                    <label for="city-search">Search City</label>
                    <div class="search-wrapper">
                        <input type="text" id="city-search"
                               placeholder="e.g. Santiago, Chile"
                               autocomplete="off"
                               autocorrect="off"
                               spellcheck="false">
                        <button id="search-btn" class="secondary-btn"
                                aria-label="Buscar ciudad" title="Buscar ciudad">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true" focusable="false">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </button>
                        <button id="gps-btn" class="secondary-btn"
                                aria-label="Usar ubicación GPS" title="Mi Ubicación">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true" focusable="false">
                                <circle cx="12" cy="12" r="3"/>
                                <line x1="12" y1="2"  x2="12" y2="6"/>
                                <line x1="12" y1="18" x2="12" y2="22"/>
                                <line x1="2"  y1="12" x2="6"  y2="12"/>
                                <line x1="18" y1="12" x2="22" y2="12"/>
                            </svg>
                        </button>
                    </div>
                    <ul id="autocomplete-list" class="autocomplete-list hidden" role="listbox"></ul>
                </div>

                <!-- Simulation controls -->
                <div id="mock-controls" class="hidden" aria-live="polite">
                    <div class="toggle-group" style="margin-bottom: 1rem;">
                        <span style="font-size: 0.875rem;" id="rain-label">Rain Intensity</span>
                        <label class="switch" aria-labelledby="rain-label">
                            <input type="checkbox" id="mock-rain">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="range-group">
                        <label for="mock-temp">Temperatura: <span id="temp-val">22</span>°C</label>
                        <input type="range" id="mock-temp" min="-5" max="45" value="22">
                    </div>
                    <div class="range-group">
                        <label for="mock-wind">Viento: <span id="wind-val">8</span> km/h</label>
                        <input type="range" id="mock-wind" min="0" max="100" value="8">
                    </div>
                </div>

                <!-- Budget controls -->
                <div class="range-group">
                    <label for="budget">Total Budget ($): <span id="budget-val">5000</span></label>
                    <input type="range" id="budget" min="0" max="10000" step="500" value="5000">
                </div>
                <div class="range-group">
                    <label for="drivers">Total Drivers: <span id="drivers-val">60</span></label>
                    <input type="range" id="drivers" min="1" max="100" step="1" value="60">
                </div>
                <div class="range-group">
                    <label for="base-cost">Base Cost ($/deliv): <span id="base-cost-val">1000</span></label>
                    <input type="range" id="base-cost" min="0" max="3000" step="100" value="1000">
                </div>
            </section>
        </aside>

        <!-- Map main area -->
        <main class="map-area" id="main-map-area">
            <div id="map" role="application" aria-label="Mapa de zonas de la ciudad"></div>

            <!-- Loading overlay -->
            <div id="loading-overlay" class="hidden" aria-live="assertive" aria-busy="true">
                <div class="loader" role="status"></div>
                <p>Optimizing budget...</p>
            </div>

            <!-- Zone info card — floating on desktop, peek-sheet on mobile -->
            <div id="info-overlay" class="info-card-floating">
                <!-- Drag handle (mobile only) -->
                <div class="panel-drag-handle" aria-hidden="true"></div>

                <!-- Clickable peek bar (both desktop heading + mobile tap target) -->
                <div class="panel-peek-bar" id="panel-peek-bar"
                     role="button" tabindex="0"
                     aria-label="Ver detalles de zona"
                     aria-expanded="false">
                    <h3>Zone Details</h3>
                    <svg class="panel-chevron"
                         xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true" focusable="false">
                        <polyline points="18 15 12 9 6 15"/>
                    </svg>
                </div>

                <!-- Info content -->
                <div class="info-content" id="selected-zone-info">
                    Select a zone on the map to view detailed incentives.
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
